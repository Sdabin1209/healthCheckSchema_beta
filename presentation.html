<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문진 시스템 입출력 지도</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b2430; --mute:#5d6b7d; --line:#d9dee6; --soft:#eef1f5;
  --model:#7c4dcc; --model-bg:#efe8fb; --code:#0f7c7a; --code-bg:#e0f3f2; --ext:#5a6677; --ext-bg:#e9ecf0;
  --flow:#2563c9; --flow-bg:#e1ebfb; --store:#b36b00; --store-bg:#fbefd9;
  --k-data:#2563c9; --k-read:#0f8a5f; --k-write:#c2410c; --k-control:#7b8494;
  --hl:#e11d48; --shadow:0 1px 2px rgba(20,30,50,.08),0 4px 14px rgba(20,30,50,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --bg:#0f141b; --panel:#171e28; --ink:#e6ebf2; --mute:#97a3b4; --line:#2a3443; --soft:#1e2733;
  --model:#b794f4; --model-bg:#2a2140; --code:#4fd1c5; --code-bg:#12302f; --ext:#a0aec0; --ext-bg:#252e3a;
  --flow:#6ea8ff; --flow-bg:#17284a; --store:#f5b042; --store-bg:#3a2b10;
  --k-data:#6ea8ff; --k-read:#46d19a; --k-write:#fb923c; --k-control:#8b95a5; --hl:#fb7185; --shadow:none;}
}
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#171e28; --ink:#e6ebf2; --mute:#97a3b4; --line:#2a3443; --soft:#1e2733;
  --model:#b794f4; --model-bg:#2a2140; --code:#4fd1c5; --code-bg:#12302f; --ext:#a0aec0; --ext-bg:#252e3a;
  --flow:#6ea8ff; --flow-bg:#17284a; --store:#f5b042; --store-bg:#3a2b10;
  --k-data:#6ea8ff; --k-read:#46d19a; --k-write:#fb923c; --k-control:#8b95a5; --hl:#fb7185; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
code,pre,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
header .sub{color:var(--mute);font-size:12.5px}
header .sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 0}
.tab{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.tab small{font-weight:500;color:var(--mute);font-size:11px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.75}
.tab:focus-visible,.chip:focus-visible,.step:focus-visible,.btn:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.node:focus,.arrow:focus{outline:none}.node:focus-visible rect{stroke:var(--hl);stroke-width:3}.arrow:focus-visible .ln{stroke-width:4}
.viewinfo{padding:10px 20px 6px;display:grid;gap:2px}
.viewinfo b{font-size:15px}
.viewinfo .trg{color:var(--mute);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:14px;padding:6px 20px 24px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.diagram{padding:6px 8px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.toolbar label{display:flex;align-items:center;gap:5px;cursor:pointer}
.sw{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle}
.sw.data{border-color:var(--k-data)}.sw.read{border-color:var(--k-read)}.sw.write{border-color:var(--k-write)}.sw.control{border-color:var(--k-control);border-top-style:dashed}
.toolbar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--soft);padding:2px 9px;border-radius:999px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
svg{width:100%;height:auto;display:block}
.node rect{stroke-width:1.6}
.node{cursor:pointer}
.node .t{font-size:15px;font-weight:700;fill:var(--ink)}
.node .s{font-size:10.5px;fill:var(--mute)}
.node.model rect{fill:var(--model-bg);stroke:var(--model)}
.node.code rect{fill:var(--code-bg);stroke:var(--code)}
.node.ext rect{fill:var(--ext-bg);stroke:var(--ext)}
.node.flow rect{fill:var(--flow-bg);stroke:var(--flow)}
.node.store rect{fill:var(--store-bg);stroke:var(--store)}
.node.dim{opacity:.28}
.node.sel rect{stroke:var(--hl);stroke-width:3}
.node .tag{font-size:10px;font-weight:700}
.node.model .tag{fill:var(--model)}.node.code .tag{fill:var(--code)}.node.ext .tag{fill:var(--ext)}.node.flow .tag{fill:var(--flow)}.node.store .tag{fill:var(--store)}
.arrow{cursor:pointer}
.arrow .hit{stroke:transparent;stroke-width:16;fill:none}
.arrow .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;transition:opacity .15s,stroke-width .15s}
.arrow.data .ln{stroke:var(--k-data)}.arrow.read .ln{stroke:var(--k-read)}.arrow.write .ln{stroke:var(--k-write)}
.arrow.control .ln{stroke:var(--k-control);stroke-dasharray:6 4}
.arrow .bd{fill:var(--panel);stroke-width:1.5}
.arrow.data .bd{stroke:var(--k-data)}.arrow.read .bd{stroke:var(--k-read)}.arrow.write .bd{stroke:var(--k-write)}.arrow.control .bd{stroke:var(--k-control)}
.arrow .bt{font-size:10.5px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.arrow.dim{opacity:.1}
.arrow.past{opacity:.55}
.arrow.hidden{display:none}
.arrow:hover .ln,.arrow.sel .ln{stroke-width:4}
.arrow.sel .bd{fill:var(--hl);stroke:var(--hl)}
.arrow.sel .bt{fill:#fff}
.arrow.act .ln{stroke-width:4;filter:drop-shadow(0 0 3px currentColor)}
.arrow.opt .ln{stroke-dasharray:3 4}
.flowtag{font-size:11px;fill:var(--mute)}
.lbl{font-size:11px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;pointer-events:none;text-anchor:middle}
.steps{padding:6px 10px 12px}
.steps h3{margin:8px 4px 6px;font-size:13px;color:var(--mute);font-weight:600;display:flex;gap:10px;align-items:center}
.step{display:grid;grid-template-columns:28px 1fr;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:8px}
.step:hover{background:var(--soft)}
.step[aria-current="step"]{background:var(--soft);border-color:var(--hl)}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
.step .ids{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.id{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--panel)}
.id.data{color:var(--k-data)}.id.read{color:var(--k-read)}.id.write{color:var(--k-write)}.id.control{color:var(--k-control)}
.opt-tag{font-size:11px;color:var(--mute);border:1px dashed var(--line);border-radius:6px;padding:0 5px;margin-left:6px}
.btn{border:1px solid var(--line);background:var(--panel);padding:3px 10px;border-radius:8px;font-size:12px}
/* side panel */
.side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.side .hd{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2;border-radius:12px 12px 0 0}
.side h2{margin:0 0 4px;font-size:16px}
.route{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:4px}
.pill{border-radius:999px;padding:1px 10px;font-weight:700;font-size:12px;border:1px solid}
.pill.model{background:var(--model-bg);color:var(--model);border-color:var(--model)}
.pill.code{background:var(--code-bg);color:var(--code);border-color:var(--code)}
.pill.ext{background:var(--ext-bg);color:var(--ext);border-color:var(--ext)}
.pill.flow{background:var(--flow-bg);color:var(--flow);border-color:var(--flow)}
.pill.store{background:var(--store-bg);color:var(--store);border-color:var(--store)}
.kindb{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;color:#fff}
.kindb.data{background:var(--k-data)}.kindb.read{background:var(--k-read)}.kindb.write{background:var(--k-write)}.kindb.control{background:var(--k-control)}
.sec{padding:10px 16px 4px}
.sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.04em;color:var(--mute);text-transform:none;display:flex;align-items:center;gap:8px}
.sec h3 .bar{flex:1;border-top:1px solid var(--line)}
.pair{display:grid;gap:10px;padding:10px 16px}
.box{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.box .bh{background:var(--soft);padding:6px 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px}
.box .bh b{font-size:13px}
.box .bh .mono{font-size:12px}
.box .bh .snap{margin-left:auto;font-size:11px;border:1px solid var(--store);color:var(--store);border-radius:6px;padding:0 6px;background:var(--store-bg)}
.box .bd{padding:6px 8px}
.desc{color:var(--mute);font-size:12.5px;padding:2px 2px 6px}
.tree{font-size:12.5px}
.fr{display:grid;grid-template-columns:minmax(110px,150px) minmax(80px,1fr);gap:2px 8px;padding:3px 0;border-top:1px dashed var(--line)}
.fr:first-child{border-top:0}
.fr .nm{font-weight:700;word-break:break-all}
.fr .nm .rq{color:var(--hl);font-weight:700;margin-left:2px}
.fr .ty{color:var(--code);font-size:11.5px;word-break:break-word}
.fr .tt{grid-column:2;color:var(--mute);font-size:12px}
.fr .tt b{color:var(--ink);font-weight:600}
.kids{margin:2px 0 2px 12px;padding-left:8px;border-left:2px solid var(--line)}
details>summary{cursor:pointer;color:var(--flow);font-size:12px;list-style:none;padding:1px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";}
details[open]>summary::before{content:"▾ ";}
.enum{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0}
.ev{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;border:1px solid var(--line);background:var(--soft);border-radius:5px;padding:0 5px;cursor:help}
.json{margin:0;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.5;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.ex-note{font-size:12px;color:var(--mute);margin:0 0 6px}
.hint{padding:26px 22px;color:var(--mute)}
.hint h2{color:var(--ink);margin:0 0 8px;font-size:16px}
.hint ul{margin:6px 0;padding-left:18px}
.hint li{margin:4px 0}
.legend{display:flex;gap:10px;align-items:center;padding:0 4px;color:var(--mute);font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl td,.tbl th{border-top:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.tbl th{color:var(--mute);font-weight:600;font-size:11.5px}
.arrowlist{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0 8px}
.arrowlist .id{cursor:pointer}
.note{font-size:12px;color:var(--mute);background:var(--soft);border-radius:8px;padding:6px 10px;margin:8px 16px}
.side.compact .de,.side.compact .why{display:none}
.tref{color:var(--flow);cursor:pointer;text-decoration:underline dotted}.tref:hover{text-decoration:underline}
.kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}
@media print{.side{position:static;max-height:none}}
</style>
</head>
<body>
<header>
  <h1>문진 시스템 입출력 지도</h1>
  <span class="sub">12개 컴포넌트 · <span id="narr"></span>개 화살표 · 화살표를 누르면 입출력 스키마가 열립니다</span>
  <span class="sp"></span>
  <span class="sub"><span class="kbd">←</span> <span class="kbd">→</span> 단계 이동 · <span class="kbd">1</span>–<span class="kbd">8</span> 시점 전환 · <span class="kbd">Esc</span> 닫기</span>
  <button class="btn" id="theme" title="밝게/어둡게">◐</button>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="시점 선택"></nav>
<div class="viewinfo" id="viewinfo"></div>
<main class="layout">
  <section>

    </div>
    <div class="card steps" id="steps" style="margin-top:14px"></div>
  </section>
  <aside class="card side" id="side" aria-live="polite"></aside>
</main>

,"optional":false},{"arrows":["R1"],"text":"세션 상태를 읽고 처리 표(9-1절)에서 “처리 안 함” 칸임을 확인한다.","optional":false},{"arrows":["W1"],"text":"일시 중지 열이면 로그만 남긴다. 세션 없음·종료 열이면 로그도 남기지 않는다.","optional":true}]},{"id":"FAILURE","label":"턴 실패","turn_kind":null,"input_kind":"처리 중 실패","trigger":"쓰기 확정 실패(J2·J4a), 직원 알림 전달 실패(J3), 응답 생성·전달 실패 등.","summary":"LangGraph가 턴 실패 신호를 프론트와 직원 화면에 보낸다. 쓰기가 확정되지 않았으면 확정 뒤의 일은 하지 않는다.","steps":[{"arrows":["P14"],"text":"프론트로 턴 실패 신호(쓰기 확정 여부·직원 알림 결과)를 보낸다. response_text는 없을 수 있다.","optional":false},{"arrows":["P15"],"text":"직원 화면으로도 턴 실패 신호를 보낸다. 개입 결정이었다면 “반영 안 됨(FAILED)” 결과도 보낸다.","optional":false},{"arrows":["W1"],"text":"실패한 턴도 대화 로그는 남긴다(실패 단계 포함).","optional":false}]}],"comps":{"frontend":{"id":"frontend","title":"프론트","kind":"외부 접점","resp":"사용자 말을 STT로 글자로 바꿔 보내고, 응답 문장을 TTS로 읽어 준다.","why":"사용자와 닿는 유일한 곳. 시스템 밖이며 받는 값·내는 값만 정한다.","contracts":{"input":"FrontendInput","output":"FrontendMessage"}},"staff_console":{"id":"staff_console","title":"사람 개입","kind":"외부 접점","resp":"직원·의료진에게 알림을 보여 주고, 그들의 결정(재개·종료)을 보낸다.","why":"위험(G1)·직원 요청(F1)에 사람이 와야 하고, 멈춘 문진은 사람만 이어 가거나 끝낼 수 있다.","contracts":{"input":"StaffConsoleInput","output":"InterventionDecision"}},"orchestrator":{"id":"orchestrator","title":"LangGraph","kind":"흐름 제어","resp":"한 턴의 순서대로 컴포넌트를 부르고, 저장소에서 정해진 범위를 가져와 건네고, 쓰기를 저장소에 전달한다.","why":"컴포넌트가 저장소를 직접 읽으면 무엇에 의존하는지가 코드 안에 숨고 혼자 시험할 수 없다. 읽기·쓰기 순서를 한 곳에서 지켜야 한 턴 안에서 어긋나지 않는다.","contracts":{"input":"OrchestratorInput","output":"OrchestratorOutput"}},"utterance_parser":{"id":"utterance_parser","title":"LoRA-A","kind":"모델","resp":"사용자 발화를 (대상, 값, 원문, 의도) 항목들로 바꾼다.","why":"자연어 해석만 모델이 하고 판단은 코드가 한다(업무분담 원칙).","contracts":{"input":"UtteranceParserInput","output":"ParserOutput"}},"answer_normalizer":{"id":"answer_normalizer","title":"정규화·검증","kind":"코드","resp":"항목 값을 표준 형태로 바꾸고, 규칙 위반·기존 값과의 같음/다름·빠진 필수 슬롯·선행 조건을 사실로 표시한다.","why":"값 규칙(단위·범위·선행 조건)이 바뀌면 이곳만 바뀐다.","contracts":{"input":"AnswerNormalizerInput","output":"NormalizerOutput"}},"answer_judge":{"id":"answer_judge","title":"상태 판정","kind":"코드","resp":"이번 발화가 각 대상에 대해 무엇을 뜻하는지(정상·정정·충돌·누락 등) 판정한다.","why":"해석 규칙(충돌·정정·확인 응답)이 바뀌면 이곳만 바뀐다. 저장 판단보다 먼저 있어야 한다(업무분담과 다른 점).","contracts":{"input":"AnswerJudgeInput","output":"JudgeOutput"}},"record_writer":{"id":"record_writer","title":"저장 판단","kind":"코드","resp":"판정을 응답 기록에 어떻게 반영할지 슬롯별로 정한다.","why":"저장소가 판단 없이 반영하게 하려면 무엇을 할지가 다 정해져 있어야 한다.","contracts":{"input":"RecordWriterInput","output":"StoreResult"}},"dialogue_planner":{"id":"dialogue_planner","title":"Plan 결정","kind":"코드","resp":"다음에 무엇을 말할지 정하고, 그 말에 필요한 값과 문장 재료를 담은 응답 지시를 만든다.","why":"대화 정책이 바뀌면 이곳만 바뀐다. 진행 기록·Plan 기록을 쓰는 유일한 곳.","contracts":{"input":"DialoguePlannerInput","output":"PlannerOutput"}},"response_generator":{"id":"response_generator","title":"LoRA-B","kind":"모델","resp":"응답 지시를 사용자 발화에 맞춰 받아 주며 자연스러운 문장으로 바꾼다.","why":"문장만 모델이 만들고 무엇을 말할지는 정하지 않는다(업무분담 원칙).","contracts":{"input":"ResponseGeneratorInput","output":"GeneratorOutput"}},"result_dispatcher":{"id":"result_dispatcher","title":"결과 전달","kind":"외부 접점(붙을 예정)","resp":"확정된 문진 결과를 시스템 밖으로 넘긴다.","why":"업무분담 COMPLETE의 Finalization 기록. 받는 곳이 정해지면 넘기는 형식을 정한다.","contracts":{"input":"DispatchInput","output":"DispatchOutput"}},"question_bank":{"id":"question_bank","title":"문항 정의 저장소","kind":"저장소","resp":"문진 설계자가 등록한 문항 정의를 버전별로 읽기 전용으로 보관한다.","why":"문항을 코드 밖에 두어 문항을 바꿔도 코드가 바뀌지 않는다.","contracts":{"state":"QuestionBank"}},"session_store":{"id":"session_store","title":"기록 저장소","kind":"저장소","resp":"세션별 응답 기록·진행 기록·Plan 기록·세션 정보·로그를 보관하고, 받은 쓰기를 정해진 효과대로 반영한다.","why":"턴 사이에 이어져야 하는 사실을 둔다.","contracts":{"state":"SessionStore"}}},"defs":{"Intent":{"oneOf":[{"const":"ANSWERED_INTENT","title":"답함","description":"묻는 문항(또는 다른 문항)에 값을 말함","x-why":"말한 값을 그 슬롯의 답으로 저장하는 경로다. 이 의도가 없으면 답과 요청·잡담을 구분할 수 없다(B1)."},{"const":"CORRECTION_MARKED","title":"정정","description":"앞서 한 답을 고친다는 표지와 함께 말함","x-why":"표지가 있으면 새 값을 확인 없이 고치고, 없으면 확인을 묻는다(C1과 C3을 가르는 유일한 근거)"},{"const":"CONFIRM_YES","title":"확인-긍정","description":"확인 질문에 \"네\"","x-why":"확인 대기를 받아들이거나 종료·중단·정정 구체화에 승낙한다(C4, H2, D5)"},{"const":"CONFIRM_NO","title":"확인-부정","description":"확인 질문에 \"아니요\"","x-why":"확인 대기를 버리거나 종료·중단·정정 구체화를 거부한다(C4, C9, D5)"},{"const":"SAYS_UNKNOWN","title":"모름","description":"모른다고 함","x-why":"모름은 빈 칸과 다르다. 기록해 두어야 정책대로 한 번 더 묻거나 넘어가고, 결과에도 '모름'으로 남는다(B7)."},{"const":"SAYS_REFUSAL","title":"거절","description":"답하지 않겠다고 함","x-why":"거절은 모름과 정책이 다르다(왜 묻는지 설명한 뒤 다시 묻는다). 구분하지 않으면 거절한 사람에게 모르냐고 다시 묻게 된다(B8)."},{"const":"PROGRESS_OP","title":"진행 조작","description":"반복·대기·나중에·중단 요청","x-why":"답이 아니라 진행에 대한 요청이라 저장하지 않고 응답만 바꾼다(D1~D5)"},{"const":"GUIDE_REQUEST","title":"안내 요청","description":"안내 목록에 있는 물음(뜻, 남은 수 등)","x-why":"안내 목록에 있는 물음은 검토된 문장으로만 답해야 하므로 무관과 구분해 안내 항목을 골라야 한다(E1~E3)."},{"const":"USER_CALLED_STAFF","title":"사람 요청","description":"직원을 찾거나 시스템이 할 수 없는 요청","x-why":"직원이 필요한 말을 무관으로 두면 요청이 아무에게도 가지 않는다(F1, F2)."},{"const":"OUT_OF_SCOPE","title":"무관","description":"문진·안내 목록과 상관없는 말","x-why":"저장도 요청도 아니므로 받아 주고 하던 질문을 잇는다(E4, K1~K9)"},{"const":"UNRECOGNIZED","title":"인식불가","description":"무슨 말인지 알 수 없음","x-why":"다시 말해 달라고 하고, 이어지면 직원을 부른다(I1, F3)"},{"const":"RISK_SIGNAL","title":"위험 신호","description":"지금 위급하다는 말","x-why":"위급한 말은 문진보다 먼저 멈추고 직원을 불러야 하므로 다른 의도와 따로 표시한다(G1)."}],"title":"의도","description":"LoRA-A가 항목마다 붙이는, 사용자가 그 말로 하려는 일.","x-why":"같은 말도 하려는 일에 따라 저장·되묻기·요청 처리로 갈린다. 하려는 일을 모델이 한 번 정해 두면 뒤의 코드 컴포넌트는 말의 뜻을 다시 해석하지 않는다(업무분담: LoRA-A는 원시 사실 추출, 판정은 코드)."},"Problem":{"oneOf":[{"const":"NO_UNIT","title":"단위 없음","description":"단위가 둘 이상인 슬롯에 단위 없이 숫자만 말함","x-why":"어느 단위인지 정할 수 없어 되묻는다(B3 \"두 번이요\")"},{"const":"OUT_OF_RANGE","title":"범위 밖","description":"그 단위의 범위(단위 정의의 범위)를 벗어난 값","x-why":"잘못 듣거나 잘못 말한 값을 저장하지 않는다(B3 \"서른 시간\")"},{"const":"AMBIGUOUS","title":"모호함","description":"범위 값이나 여러 값","x-why":"\"두세 병\"처럼 값이 하나로 정해지지 않으면 저장할 수 없어 되물어야 한다(B3)."},{"const":"MISMATCH","title":"다른 답과 맞지 않음","description":"선행 조건으로 이어진 다른 답과 모순","x-why":"선행 조건으로 이어진 두 답이 모순이면(\"안 마셔요\" + \"소주 두 병\") 어느 쪽도 저장할 수 없어 둘 다 짚어 되묻는다(B4)."},{"const":"UNKNOWN_TARGET","title":"정의에 없는 대상","description":"문항 정의에 없는 문항·슬롯을 가리킴","x-why":"답 계열 항목은 저장할 곳이 없어 무관으로 다루고, 요청·위험 신호는 대상만 없는 것으로 보고 그 의도대로 다룬다(K9, 6절 규칙 8)."}],"title":"문제","description":"정규화·검증이 항목 값에서 찾은 문제.","x-why":"값을 저장할 수 없는 이유를 상태 판정에 사실로 넘겨, 판정이 값 규칙을 다시 알 필요가 없게 한다."},"Reason":{"oneOf":[{"const":"NO_UNIT","title":"단위 없음","description":"단위를 말해 달라","x-why":"단위를 말해 달라고 해야 사용자가 무엇을 덧붙일지 안다(\"두 번\" → \"일주일에 두 번\")."},{"const":"OUT_OF_RANGE","title":"범위 밖","description":"값이 가능한 범위를 벗어났다","x-why":"가능한 범위를 벗어났다고 알려야 사용자가 잘못 말했는지 다시 본다(\"서른 시간\")."},{"const":"AMBIGUOUS","title":"모호함","description":"하나로 말해 달라","x-why":"하나로 말해 달라고 해야 범위 값을 하나의 값으로 고쳐 말한다(\"두세 병\")."},{"const":"MISMATCH","title":"다른 답과 맞지 않음","description":"앞 답과 맞지 않는다","x-why":"앞 답과 맞지 않는다고 알려야 사용자가 둘 중 어느 쪽을 고칠지 안다(B4)."},{"const":"UNRECOGNIZED","title":"인식불가","description":"알아듣지 못했다","x-why":"알아듣지 못했다고 해야 사용자가 같은 말을 다시 한다(구체화와 하는 말이 다르다, I1)."},{"const":"MISSING_SLOT","title":"필수 슬롯 누락","description":"빠진 부분이 있다","x-why":"빠진 부분이 있다고 해야 이미 말한 것을 다시 말하지 않고 빠진 것만 답한다(B2)."}],"title":"사유","description":"되물을 때 사용자에게 짚어 줄 이유.","x-why":"LoRA-B가 왜 다시 묻는지 말해야 사용자가 무엇을 고쳐 말할지 안다(B2, B3, I1)."},"JudgmentStatus":{"oneOf":[{"const":"ANSWERED","title":"정상","description":"쓸 수 있는 값(첫 답이거나 기존과 같음)","x-why":"쓸 수 있는 값이라 첫 답이면 저장하고, 기존과 같으면 바꿀 것이 없다(남은 확인 대기만 버린다). 업무분담 ANSWERED."},{"const":"MISSING","title":"누락","description":"같은 문항의 필수 슬롯이 빠짐","x-why":"같은 문항에서 받은 값은 저장하고 빠진 칸만 다시 묻기 위해 빠진 칸을 따로 판정한다(업무분담 MISSING, B2)."},{"const":"UNCLEAR","title":"애매","description":"값에 문제가 있음","x-why":"저장하지 않고 구체화를 묻는다(UNCLEAR, B3, B4)"},{"const":"CONFLICT","title":"충돌","description":"표지 없이 기존 답과 다른 값","x-why":"기존 값을 지키고 확인을 묻는다(CONFLICT, C3)"},{"const":"CORRECTION","title":"정정","description":"고친 값이 확정됨","x-why":"새 revision으로 저장한다(CORRECTION, C1)"},{"const":"UNKNOWN","title":"모름","description":"모름","x-why":"모름도 하나의 응답이라 기록해야 정책대로 다시 묻거나 넘어간다(업무분담 UNKNOWN, B7)."},{"const":"REJECTED","title":"거절","description":"거절","x-why":"거절도 하나의 응답이라 기록해야 정책대로 설명하거나 넘어간다(업무분담 REJECTED, B8)."},{"const":"PREREQUISITE_UNMET","title":"선행 불충족","description":"선행 조건이 정해지지 않았거나 맞지 않는 후속 문항에 대한 말","x-why":"후속 답은 선행 답이 정해진 뒤에만 기록한다. 버리지 않고 판정으로 내는 이유는, 버리면 사용자가 맞게 답해도 응답이 없는 것으로 보여 같은 질문이 끝없이 반복되기 때문이다(B4, C2)"}],"title":"상태","description":"상태 판정이 대상마다 내린 판정.","x-why":"업무분담 문서의 상태(ANSWERED·MISSING·UNCLEAR·CONFLICT·CORRECTION·UNKNOWN·REJECTED)를 저장 판단과 Plan이 같은 말로 쓰기 위해. OOS와 COMPLETE는 대상에 대한 판정이 아니라서 발화 판정 결과와 세션 상태로 옮겼다(업무분담과 다른 점 표 참고)."},"UtteranceResult":{"oneOf":[{"const":"HAS_ANSWER","title":"응답 있음","description":"판정·확인 응답·값 없는 정정 요청·위험 신호 중 하나라도 있음","x-why":"답·확인 응답·고칠 요청·위험 중 하나라도 있으면 기록이나 진행이 바뀌었으므로 직전 응답을 되풀이하지 않고 새 응답 지시를 만들어야 한다."},{"const":"REQUEST_ONLY","title":"요청만","description":"위의 것은 없고 요청이 있음","x-why":"요청만 있는 턴은 기록이 바뀌지 않았으므로 반복 요청이면 직전 응답을 그대로 다시 낼 수 있고, 알아듣지 못한 턴으로 세지도 않는다(D1)."},{"const":"OUT_OF_SCOPE_ONLY","title":"무관만","description":"위의 것도 요청도 없고 무관 항목이 있음","x-why":"할 일이 없는 말이라 받아 주고 하던 질문을 잇는다. 업무분담 OOS에 해당한다(E4, K1~K9)."},{"const":"UNRECOGNIZED_TURN","title":"알아듣지 못함","description":"그 밖(빈 발화, 인식불가뿐)","x-why":"아무것도 알아듣지 못한 턴을 세어야 다시 말해 달라고 하다가 이어지면 직원을 부른다(I1, F3)."}],"title":"발화 판정 결과","description":"발화 전체가 무엇이었는지. 겹치지 않고 모든 경우를 덮는다.","x-why":"Plan이 \"답이 있었나, 요청만 있었나, 못 알아들었나\"를 하나의 값으로 알아야 알아듣지 못한 턴을 세고 반복 요청을 처리할 수 있다(D1, I1, F3)."},"AskAction":{"oneOf":[{"const":"ASK_NEXT","title":"다음 문항 묻기","description":"열린 문항을 묻는다","x-why":"열린 문항을 차례로 물어 문진을 진행한다. 업무분담 NEXT."},{"const":"ASK_MISSING","title":"빠진 슬롯 되묻기","description":"같은 문항의 빠진 필수 슬롯만 묻는다","x-why":"같은 문항에서 받은 값은 다시 묻지 않고 빠진 칸만 묻는다. 업무분담 ASK_MISSING."},{"const":"ASK_CLARIFY","title":"구체화 요청","description":"애매한 값을 짚어 다시 묻는다","x-why":"애매한 값을 사용자가 한 말 그대로 짚어 하나로 다시 말하게 한다. 업무분담 ASK_CLARIFICATION."},{"const":"ASK_CONFIRM","title":"확인 대기 확인","description":"기존 답과 새 답 중 어느 것이 맞는지 묻는다","x-why":"표지 없이 다른 값을 말했을 때 잘못 들었을 수 있으므로 기존 답과 새 답 중 어느 것이 맞는지 확인한다. 업무분담 ASK_CONFLICT."},{"const":"ASK_AFTER_UNKNOWN","title":"모름 뒤 재질문","description":"모름에 한 번 더 묻는다","x-why":"모름에 한 번 더 기회를 주는 문항이 있다(정책). 업무분담 ASK_OR_HOLD."},{"const":"ASK_AFTER_REFUSAL","title":"거절 시 설명 후 재질문","description":"왜 묻는지 설명하고 다시 묻는다","x-why":"거절한 사람에게 왜 묻는지 설명하면 답할 수 있다(정책). 업무분담 HOLD_OR_SKIP."},{"const":"ASK_CORRECTION_TARGET","title":"정정 구체화","description":"무엇을, 어떤 값으로 고칠지 묻는다","x-why":"업무분담에 없어 더함. 값 없이 고치겠다는 말을 버리면 사용자의 정정 의사가 사라진다(C5, C6)"},{"const":"ASK_FINISH","title":"종료 확인","description":"마칠지 묻는다","x-why":"업무분담 COMPLETE 앞에 더함. 마친 뒤에는 고칠 수 없으므로 한 번 묻는다(H1, A6)"},{"const":"ASK_STOP","title":"중단 확인","description":"정말 그만둘지 묻는다","x-why":"업무분담에 없어 더함. 잘못 알아들은 \"그만\"으로 문진이 끝나지 않게(D4)"}],"title":"묻기 행동","description":"사용자에게 답을 기다리는 행동.","x-why":"기다리는 답에는 이 행동만 들어갈 수 있다. 다음 턴의 짧은 답(\"네\", \"두 병이요\")이 무엇에 대한 답인지 알려면 묻는 행동이어야 하기 때문이다(B5)."},"Action":{"oneOf":[{"const":"ASK_NEXT","title":"다음 문항 묻기","description":"열린 문항을 묻는다","x-why":"열린 문항을 차례로 물어 문진을 진행한다. 업무분담 NEXT."},{"const":"ASK_MISSING","title":"빠진 슬롯 되묻기","description":"같은 문항의 빠진 필수 슬롯만 묻는다","x-why":"같은 문항에서 받은 값은 다시 묻지 않고 빠진 칸만 묻는다. 업무분담 ASK_MISSING."},{"const":"ASK_CLARIFY","title":"구체화 요청","description":"애매한 값을 짚어 다시 묻는다","x-why":"애매한 값을 사용자가 한 말 그대로 짚어 하나로 다시 말하게 한다. 업무분담 ASK_CLARIFICATION."},{"const":"ASK_CONFIRM","title":"확인 대기 확인","description":"기존 답과 새 답 중 어느 것이 맞는지 묻는다","x-why":"표지 없이 다른 값을 말했을 때 잘못 들었을 수 있으므로 기존 답과 새 답 중 어느 것이 맞는지 확인한다. 업무분담 ASK_CONFLICT."},{"const":"ASK_AFTER_UNKNOWN","title":"모름 뒤 재질문","description":"모름에 한 번 더 묻는다","x-why":"모름에 한 번 더 기회를 주는 문항이 있다(정책). 업무분담 ASK_OR_HOLD."},{"const":"ASK_AFTER_REFUSAL","title":"거절 시 설명 후 재질문","description":"왜 묻는지 설명하고 다시 묻는다","x-why":"거절한 사람에게 왜 묻는지 설명하면 답할 수 있다(정책). 업무분담 HOLD_OR_SKIP."},{"const":"ASK_CORRECTION_TARGET","title":"정정 구체화","description":"무엇을, 어떤 값으로 고칠지 묻는다","x-why":"업무분담에 없어 더함. 값 없이 고치겠다는 말을 버리면 사용자의 정정 의사가 사라진다(C5, C6)"},{"const":"ASK_FINISH","title":"종료 확인","description":"마칠지 묻는다","x-why":"업무분담 COMPLETE 앞에 더함. 마친 뒤에는 고칠 수 없으므로 한 번 묻는다(H1, A6)"},{"const":"ASK_STOP","title":"중단 확인","description":"정말 그만둘지 묻는다","x-why":"업무분담에 없어 더함. 잘못 알아들은 \"그만\"으로 문진이 끝나지 않게(D4)"},{"const":"ASK_REPEAT","title":"다시 말씀 요청","description":"알아듣지 못했으니 다시 말해 달라","x-why":"알아듣지 못했을 때는 값을 짚는 구체화가 아니라 다시 말해 달라는 말이 필요하다. 업무분담 어휘에 없어 더했다(I1)."},{"const":"CALL_STAFF","title":"도움 요청","description":"알아듣지 못함이 이어져 직원을 부른다","x-why":"알아듣지 못함이 이어지면 시스템이 더 할 수 있는 일이 없어 사람이 와야 한다. 업무분담 어휘로는 표현할 수 없어 더했다(F3)."},{"const":"REDIRECT","title":"무관 안내 후 다시 묻기","description":"받아 주고 하던 질문을 잇는다","x-why":"문진과 상관없는 말을 받아 준 뒤 하던 질문을 다시 해야 대화가 이어진다. 업무분담 REDIRECT."},{"const":"RISK_NOTICE","title":"위험 안내","description":"위급 안내를 하고 멈춘다","x-why":"위급한 상황에서는 문진을 멈추고 검토된 안내만 해야 한다. 업무분담 어휘에 없어 더했다(G1, G3)."},{"const":"WAIT_NOTICE","title":"대기 안내","description":"기다리겠다고 한다","x-why":"기다려 달라는 사용자에게 다음 질문을 하면 재촉이 된다. 업무분담 어휘로는 표현할 수 없어 더했다(D2)."},{"const":"STAFF_NOTICE","title":"사람 연결 안내","description":"직원을 불렀다고 한다","x-why":"직원을 불렀다는 것을 사용자에게 알려야 기다린다. 업무분담 어휘로는 표현할 수 없어 더했다(F1, F2)."},{"const":"FAREWELL","title":"종료 인사","description":"마친다","x-why":"마칠 때(완료든 미완료든) 인사로 끝내고, 미완료면 문진 중단을 함께 알린다. 업무분담 COMPLETE."}],"title":"행동","description":"Plan이 이번 턴에 하기로 한 일. 한 턴에 하나.","x-why":"LoRA-B가 무엇을 말할지와, 다음 턴이 무엇을 기다리는지를 한 값으로 정한다. 업무분담 문서의 Plan 어휘(NEXT 등)에 대응하고, 업무분담에 없는 상황 때문에 더한 것은 값마다 이유를 적었다."},"StoreAction":{"oneOf":[{"const":"FIRST_WRITE","title":"첫 저장","description":"빈 슬롯에 값을 넣음","x-why":"빈 칸에 처음 들어온 답은 이력 없이 현재값만 정한다."},{"const":"NEW_REVISION","title":"새 revision","description":"있던 답을 고침(이전 답은 이력으로)","x-why":"고친 답을 저장하되 이전 답을 버리지 않고 이력으로 남겨 결과에 수정 이력이 넘어가게 한다(업무분담 CORRECTION의 새 Revision, C1)."},{"const":"RECORD_UNKNOWN","title":"모름 기록","description":"모름으로 기록","x-why":"모름을 현재값으로 기록해 빈 칸과 구분하고, 그 전 답이 있었으면 이력으로 남긴다."},{"const":"RECORD_REFUSAL","title":"거절 기록","description":"거절로 기록","x-why":"거절을 현재값으로 기록해 모름·빈 칸과 구분하고, 그 전 답이 있었으면 이력으로 남긴다."},{"const":"SET_PENDING","title":"확인 대기 둠","description":"기존 값은 두고 새 값을 확인 대기에 둠","x-why":"표지 없이 다른 값을 말하면 잘못 들었을 수도 있으므로 기존 값을 지키고 새 값은 확인을 받을 때까지 따로 둔다(업무분담 CONFLICT의 기존 확정값 유지, C3)."},{"const":"ACCEPT_PENDING","title":"확인 대기 받아들임","description":"확인 대기 값을 현재값으로","x-why":"사용자가 새 값이 맞다고 확인했으므로 확인 대기 값을 현재값으로 올리고 옛 답은 이력으로 남긴다."},{"const":"DROP_PENDING","title":"확인 대기 버림","description":"확인 대기를 지움","x-why":"확인 대기가 더 필요 없어졌을 때(기존 답이 맞다는 응답, 또는 정정·모름·거절로 그 칸이 따로 정해짐) 확인 대기만 지운다. 현재값은 이 동작으로 바뀌지 않는다."},{"const":"INVALIDATE","title":"무효화","description":"선행 답이 바뀌어 후속 답을 지움","x-why":"선행 답이 바뀌어 맞지 않게 된 후속 답을 지우되 이력으로 남긴다. 지우지 않으면 술을 안 마신다는 사람에게 음주량이 남는다."}],"title":"저장 동작","description":"저장 판단이 슬롯마다 기록 저장소에 시키는 일.","x-why":"기록 저장소가 판단 없이 정해진 효과대로만 반영하게 하려면, 무엇을 할지가 동작 하나로 정해져 있어야 한다(업무분담: DB 처리 열)."},"SkipReason":{"oneOf":[{"const":"UNKNOWN_ACCEPTED","title":"모름 수용","description":"모름을 받아들임","x-why":"모름을 받아들여 더 묻지 않았다는 것을 결과에 남겨, 받는 쪽이 빈 답의 까닭을 안다."},{"const":"REFUSAL_ACCEPTED","title":"거절 수용","description":"거절을 받아들임","x-why":"거절을 받아들여 더 묻지 않았다는 것을 결과에 남겨, 받는 쪽이 빈 답의 까닭을 안다."},{"const":"ATTEMPTS_EXCEEDED","title":"시도 초과","description":"질문 상한만큼 물어도 쓸 수 있는 답이 없음","x-why":"질문 상한까지 물어도 쓸 수 있는 답이 없어 넘어갔다는 것을 남긴다. 사용자가 모른다고 한 것과는 다르다."}],"title":"건너뜀 사유","description":"문항을 더 묻지 않기로 한 까닭.","x-why":"결과를 받는 쪽이 왜 답이 없는지 알아야 한다(B10, 업무분담 retry_count·HOLD_OR_SKIP)."},"SessionStatus":{"oneOf":[{"const":"IN_PROGRESS","title":"진행 중","description":"문진 중","x-why":"이 상태에서만 사용자 발화를 처리한다. 멈춤·종료와 구분해야 처리 표가 입력을 받을지 정한다."},{"const":"PAUSED_RISK","title":"일시 중지(위험)","description":"위험으로 멈춤. 사용자 발화는 처리하지 않음","x-why":"위험으로 멈춘 동안에는 사용자 말을 처리하지 않고 직원의 재개·종료만 받아야 한다."},{"const":"ENDED_COMPLETE","title":"종료(완료)","description":"마침","x-why":"사용자가 마치기로 확인한 정상 종료다. 결과를 받는 쪽이 완료된 결과로 다룬다."},{"const":"ENDED_STAFF","title":"종료(미완료: 개입 종료)","description":"직원이 끝냄","x-why":"직원이 끝낸 미완료다. 받는 쪽이 이탈·사용자 중단과 구분해 사유를 안다."},{"const":"ENDED_LEFT","title":"종료(미완료: 이탈)","description":"사용자가 떠남","x-why":"사용자가 떠난 미완료다. 받는 쪽이 사유를 구분한다."},{"const":"ENDED_USER_STOP","title":"종료(미완료: 사용자 중단)","description":"사용자가 그만둠","x-why":"사용자가 그만두기로 확인한 미완료다. 받는 쪽이 사유를 구분한다."}],"title":"세션 상태","description":"세션이 어디에 있는지.","x-why":"LangGraph가 입력을 처리할지(처리 표)와, 결과를 받는 쪽이 완료·미완료와 그 사유를 아는 데 쓴다(A4, A5, G5, H2)."},"TurnKind":{"oneOf":[{"const":"SESSION_START","title":"세션 시작","description":"첫 접속·재접속","x-why":"말 없이 시작·재접속한 턴이다. Plan이 지금 물을 것을 묻는다."},{"const":"UTTERANCE","title":"발화","description":"사용자 말","x-why":"사용자 말이 온 턴이다. LoRA-A부터 전체 흐름을 돈다."},{"const":"RESUME","title":"재개","description":"위험 일시 중지 뒤 직원이 재개","x-why":"위험으로 멈춘 세션을 직원이 이어 가게 한 턴이다. 재개를 알리고 이어서 묻는다."},{"const":"INTERVENTION_END","title":"개입 종료","description":"직원이 끝냄","x-why":"직원이 끝낸 턴이다. 확인 없이 미완료로 마친다."},{"const":"END_LEFT","title":"이탈 종료","description":"프론트가 떠났다고 알림","x-why":"사용자가 떠났다고 프론트가 알린 턴이다. 확인할 사람이 없으므로 바로 미완료로 마친다."}],"title":"턴 종류","description":"LangGraph가 처리 표로 정한 이번 턴의 종류.","x-why":"Plan이 발화 없이도 무엇을 해야 하는지(첫 질문, 재개, 종료) 알게 한다."},"RiskResponse":{"oneOf":[{"const":"IMMEDIATE","title":"즉시","description":"바로 멈추고 직원을 부름","x-why":"그 답 자체가 위급하면(죽고 싶은 생각 = 예) 바로 멈추고 직원을 불러야 한다."},{"const":"ON_RESULT","title":"결과 표시","description":"계속하고 결과에 표시","x-why":"위험하지만 지금 멈출 정도는 아닌 답(높은 혈압)은 문진을 이어 가고 결과에 표시해 의료진이 본다."}],"title":"위험 대응","description":"위험 기준에 해당하는 답에 할 일.","x-why":"바로 멈춰야 하는 답과 결과에만 표시할 답을 나눈다(G3, G4)."},"AlertKind":{"oneOf":[{"const":"RISK","title":"위험","description":"위험 신호나 즉시 위험 기준","x-why":"직원이 가장 먼저 가야 하는 알림이다."},{"const":"CALL_STAFF","title":"도움 요청","description":"알아듣지 못함이 이어짐","x-why":"시스템이 사용자를 알아듣지 못해 사람이 도와야 하는 알림이다."},{"const":"USER_CALLED_STAFF","title":"사람 요청","description":"사용자가 직원을 찾음","x-why":"사용자가 직원을 원한 알림이다. 무엇을 원하는지 근거가 함께 간다."}],"title":"알림 종류","description":"직원 알림의 까닭.","x-why":"직원이 왜 와야 하는지 바로 알게 한다."},"PauseKind":{"oneOf":[{"const":"PAUSE","title":"일시 중지","description":"위험으로 멈춤","x-why":"언제 무엇 때문에 멈췄는지 결과에 남긴다."},{"const":"RESUME","title":"재개","description":"직원이 이어 가게 함","x-why":"멈춘 뒤 다시 이어 갔다는 것을 남겨, 그 뒤의 답이 재개 후의 답임을 안다."}],"title":"중지 이력 종류","description":"중지 이력 항목의 종류.","x-why":"결과에 문진 중 멈춘 적이 있는지와 언제 다시 이어졌는지 남긴다(G7)."},"ProgressOp":{"oneOf":[{"const":"REPEAT","title":"반복","description":"다시 말해 달라","x-why":"직전 말을 다시 들으려는 요청이다. 새로 묻지 않고 같은 말을 되풀이해야 한다."},{"const":"WAIT","title":"대기","description":"기다려 달라","x-why":"잠깐 기다려 달라는 요청이다. 다음 질문으로 재촉하지 않아야 한다."},{"const":"LATER","title":"나중에","description":"이 문항은 나중에","x-why":"지금 문항을 나중에 하겠다는 요청이다. 다른 것을 먼저 묻고 맨 뒤에 다시 묻는다."},{"const":"STOP","title":"중단","description":"그만하겠다","x-why":"그만하겠다는 요청이다. 잘못 들었을 수 있어 바로 끝내지 않고 확인한다."}],"title":"진행 조작","description":"진행에 대한 요청의 종류.","x-why":"반복은 직전 말을 다시, 대기는 기다림, 나중에는 미룸, 중단은 확인으로 응답이 서로 달라서 어떤 요청인지 구분해야 한다."},"RequestKind":{"oneOf":[{"const":"REPEAT","title":"반복","description":"다시 말해 달라","x-why":"직전 말을 다시 들으려는 요청이다. 새로 묻지 않고 같은 말을 되풀이해야 한다."},{"const":"WAIT","title":"대기","description":"기다려 달라","x-why":"잠깐 기다려 달라는 요청이다. 다음 질문으로 재촉하지 않아야 한다."},{"const":"LATER","title":"나중에","description":"이 문항은 나중에","x-why":"지금 문항을 나중에 하겠다는 요청이다. 다른 것을 먼저 묻고 맨 뒤에 다시 묻는다."},{"const":"STOP","title":"중단","description":"그만하겠다","x-why":"그만하겠다는 요청이다. 잘못 들었을 수 있어 바로 끝내지 않고 확인한다."},{"const":"GUIDE","title":"안내","description":"안내 목록의 물음","x-why":"안내 목록의 물음이다. 검토된 안내 문장으로 답하고 하던 질문을 잇는다."},{"const":"STAFF_REQUEST","title":"사람","description":"직원 요청","x-why":"직원을 찾는 요청이다. 직원을 부르고 문진은 이어 간다."}],"title":"요청 종류","description":"발화 판정의 요청 하나의 종류.","x-why":"진행 조작 넷에 안내·사람을 더해, Plan이 요청을 한 목록으로 다루게 한다."},"FillValue":{"oneOf":[{"const":"REMAINING_COUNT","title":"남은 문항 수","description":"이번 턴 반영 뒤에 열려 있는 문항의 수. 미룬 문항은 세고, 건너뛴 문항(모름 수용·거절 수용·시도 초과)과 선행 조건이 맞지 않는 문항은 세지 않는다","x-why":"\"얼마나 남았어요?\"의 답은 세션마다 다른 수라 문장에 고정할 수 없고 Plan이 계산해 넣어야 한다."}],"title":"채울 값","description":"안내 문장에 넣을 계산 값의 종류.","x-why":"\"얼마나 남았어요?\"의 답은 고정 문장이 아니라 세션마다 계산해야 한다(E2)."},"Flow":{"oneOf":[{"const":"CONTINUE","title":"계속","description":"이어 감","x-why":"대부분의 턴은 세션을 닫지 않고 다음 입력을 기다려야 한다."},{"const":"END","title":"종료","description":"닫음","x-why":"끝내는 턴(종료 확인·중단 확인 승낙, 개입 종료, 이탈 종료)에는 결과를 넘기고 세션을 닫아야 한다. 닫힌 세션은 다시 처리되지 않으므로 결과를 넘길 기회는 이때뿐이다."}],"title":"흐름","description":"이번 턴 뒤 세션을 닫을지.","x-why":"LangGraph가 결과 전달을 부르고 세션을 닫는다(H2, D5, F4, A4)."},"Decision":{"oneOf":[{"const":"RESUME","title":"재개","description":"이어 감","x-why":"위험이 지나갔다고 직원이 판단하면 멈춘 곳부터 이어 간다."},{"const":"END","title":"종료","description":"끝냄","x-why":"직원이 문진을 더 하지 않기로 하면 미완료로 마치고 결과를 넘긴다."}],"title":"개입 결정 값","description":"직원의 재개 또는 종료.","x-why":"위험으로 멈춘 문진은 사람만 이어 가거나 끝낼 수 있다(G6, G7, F4)."},"InputKind":{"oneOf":[{"const":"SESSION_START","title":"세션 시작 신호","description":"첫 접속·재접속","x-why":"말 없는 시작·재접속은 해석할 발화가 없어 Plan부터 부르는 등 처리가 달라서 다른 입력과 구분해야 한다."},{"const":"UTTERANCE","title":"발화","description":"사용자 말","x-why":"발화만 LoRA-A부터 전체 흐름을 돌기 때문에 다른 입력과 구분해야 한다."},{"const":"INTERVENTION","title":"개입 결정","description":"직원의 재개·종료","x-why":"직원의 결정은 사람 개입에서 오고 일시 중지 상태에서도 처리하므로 사용자 입력과 구분해야 한다."},{"const":"SESSION_END","title":"세션 종료 신호","description":"사용자가 떠남","x-why":"떠났다는 신호는 확인 없이 미완료로 끝내야 하므로 다른 입력과 구분해야 한다."}],"title":"입력 종류","description":"턴을 시작한 입력.","x-why":"로그의 Trace가 무엇으로 시작했는지 알아야 신고된 턴을 다시 따라갈 수 있다(J6)."},"QuestionId":{"type":"string","pattern":"^[A-Za-z0-9가-힣_.\\-]{1,64}$","title":"문항 ID","description":"문진 설계자가 문항 정의 저장소에 정한 문항 식별자.","x-why":"모든 컴포넌트가 같은 문항을 같은 이름으로 가리켜야 한다."},"SlotRef":{"type":"object","properties":{"question_id":{"$ref":"#/$defs/QuestionId","title":"문항 ID","description":"그 슬롯이 속한 문항.","x-why":"슬롯 ID만으로는 어느 문항의 칸인지 모른다."},"repeat_key":{"type":"string","pattern":"^[A-Za-z0-9가-힣_.\\-]{0,64}$","title":"반복 키","description":"반복 문항에서 그 줄의 식별자. 반복하지 않는 문항은 빈 문자열.","x-why":"문항·슬롯 쌍만으로는 같은 칸의 두 줄을 가리킬 수 없다. \"소주는 2병인데 맥주는 모르겠어요\"는 같은 칸에 줄이 둘이고 줄마다 판정이 다르다(V1, V2, V3). 빈 문자열로 두면 반복하지 않는 문항도 같은 모양으로 가리킨다."},"slot_id":{"type":"string","pattern":"^[A-Za-z0-9가-힣_.\\-]{1,64}$","title":"슬롯 ID","description":"문항 안의 칸 식별자.","x-why":"한 문항에 칸이 여럿일 수 있어(음주 빈도·양) 문항 ID만으로는 어느 칸인지 모른다."}},"required":["question_id","repeat_key","slot_id"],"additionalProperties":false,"title":"슬롯","description":"답 칸 하나. 문항 ID·반복 키·슬롯 ID 셋으로 가리킨다.","x-why":"한 문항에 답 칸이 여럿일 수 있고(음주 상세의 빈도·양), 한 문항이 줄마다 반복될 수 있다(주종별 음주량). 셋이어야 같은 칸의 다른 줄을 가리킬 수 있다."},"WholeQuestion":{"type":"object","properties":{"question_id":{"$ref":"#/$defs/QuestionId","title":"문항 ID","description":"가리키는 문항.","x-why":"문항 전체에 대한 말(\"술은 잘 모르겠어요\")은 그 문항의 모든 칸에 펼쳐 기록해야 하므로 어느 문항인지 있어야 한다."},"whole_question":{"const":true,"title":"문항 전체 표시","description":"항상 true.","x-why":"슬롯 대상과 모양으로 구분하기 위해."}},"required":["question_id","whole_question"],"additionalProperties":false,"title":"문항 전체","description":"문항의 모든 슬롯을 한꺼번에 가리킴.","x-why":"\"술은 잘 모르겠어요\"처럼 문항 전체에 대한 모름·거절과, 문항에 대한 안내·나중에가 있다(B7, D3, E1). 저장은 항상 슬롯 단위라 저장 판단이 펼친다."},"Target":{"oneOf":[{"$ref":"#/$defs/SlotRef"},{"$ref":"#/$defs/WholeQuestion"}],"title":"대상","description":"슬롯 하나 또는 문항 전체.","x-why":"항목·판정·응답 지시가 슬롯과 문항 전체를 같은 자리에서 가리켜야 한다."},"Value":{"oneOf":[{"type":"string","minLength":1,"maxLength":2000,"title":"선택지 값","description":"슬롯 선택지 중 하나.","x-why":"선택지 슬롯의 답은 정해진 말 중 하나여야 결과를 받는 쪽이 집계할 수 있다."},{"type":"object","properties":{"amount":{"type":"number","minimum":-100000,"maximum":100000,"title":"수","description":"단위로 센 수.","x-why":"범위 밖인지, 위험 기준을 넘는지, 기존 답과 같은지를 수로 비교해야 한다."},"unit":{"type":"string","minLength":1,"maxLength":2000,"title":"단위","description":"슬롯 단위 목록 중 하나의 이름(환산이 있으면 환산 뒤 단위).","x-why":"같은 수라도 단위가 다르면 다른 값이다."}},"required":["amount","unit"],"additionalProperties":false,"title":"단위 값","description":"수와 그 단위.","x-why":"단위 슬롯은 같은 수라도 단위가 다르면 다른 답이므로 수와 단위를 함께 둔다."}],"title":"값","description":"표준 값. 선택지 슬롯은 선택지 문자열, 단위 슬롯은 수와 단위.","x-why":"값 비교(같음·다름, 범위, 위험 기준)는 정규화·검증만 하지만, 단위가 서로 환산되지 않는 슬롯(주 n회와 월 n회)은 수만으로 값을 나타낼 수 없다. 문자열 \"주 2회\"로 두면 받는 쪽마다 다시 풀어야 하므로 수와 단위를 나눠 둔다."},"PendingId":{"type":"string","pattern":"^[A-Za-z0-9가-힣_.\\-]{1,64}$","title":"확인 대기 ID","description":"저장 판단이 확인 대기를 둘 때 새로 만드는, 세션 안에서 겹치지 않는 값(예: UUID).","x-why":"\"네\"가 어느 확인 대기에 대한 답인지 상태 판정이 이 ID로 잇는다. 같은 슬롯에 새 충돌 값이 와서 확인 대기가 바뀌면 이전 확인에 대한 \"네\"가 새 값을 받아들이지 않게 한다(C4)."},"SessionId":{"type":"string","pattern":"^[A-Za-z0-9가-힣_.\\-]{1,64}$","title":"세션 식별","description":"프론트가 정한 세션 식별자. 발급· ":"새로 둠","description":"새 충돌 값을 확인 대기에 둔다(있던 것은 대체)","x-why":"표지 없이 다른 값을 말했으므로 기존 값을 지키고 새 값을 확인 대기에 둔다. 있던 확인 대기는 새 값으로 바뀐다."},{"const":"ACCEPT","title":"받아들임","description":"확인 대기 값을 현재값으로","x-why":"확인 대기 값이 맞다는 응답이므로 그 값을 현재값으로 올리게 한다."},{"const":"DROP","title":"버림","description":"확인 대기를 지운다","x-why":"기존 답이 맞다는 응답(\"아니요\", 기존 값을 다시 말함)이거나 정정·모름·거절로 확인이 필요 없어졌으므로 확인 대기를 지우게 한다."},{"const":"NONE","title":"없음","description":"확인 대기에 손대지 않음","x-why":"확인 대기가 없거나 이 판정(애매·누락 등)이 확인 대기를 건드리지 않음을 분명히 해 저장 판단이 손대지 않게 한다."}],"title":"확인 대기 처리","description":"이 판정이 그 슬롯 확인 대기에 하는 일.","x-why":"확인 대기를 둘지, 받아들일지, 버릴지를 저장 판단에 알린다."},"target_pending_ids":{"type":"array","items":{"$ref":"#/$defs/PendingId"},"maxItems":20,"title":"대상 확인 대기 ID","description":"받아들임·버림일 때 그 확인 대기 ID. 문항 전체 모름·거절이 여럿을 버리면 여럿.","x-why":"받아들이거나 버릴 확인 대기를 ID로 가리켜야, 그 사이 같은 슬롯에 생긴 다른 확인 대기를 잘못 처리하지 않는다."},"mismatched_slots":{"type":"array","items":{"$ref":"#/$defs/SlotRef"},"maxItems":20,"title":"맞지 않는 슬롯","description":"사유에 \"다른 답과 맞지 않음\"이 있을 때 상대 슬롯.","x-why":"Plan이 상대 값을 말할 값에 담아 두 값을 함께 짚게 한다(B4)."},"risk_rule":{"anyOf":[{"$ref":"#/$defs/RiskResponse"},{"type":"null","description":"없음","x-why":"이번 값이 없거나 그 값이 위험 기준에 걸리지 않은 판정이다(B1, B7a). 8-1 규칙 1이 즉시 위험 기준이 있을 때만 멈추므로, 없음이 \"이 판정으로는 멈추지 않음\"이다."}],"title":"위험 기준","description":"이번 값이 있을 때 정규화·검증의 표시를 옮긴다.","x-why":"Plan이 즉시 위험이면 멈추고, 저장 판단이 위험 표시를 남긴다(G3, G4)."}},"required":["target","status","reasons","value_now","said_value","pending_handling","target_pending_ids","mismatched_slots","risk_rule"],"additionalProperties":false,"title":"판정","description":"대상 하나에 대해 이번 발화가 뜻하는 것.","x-why":"저장 판단은 정정(새 revision)과 충돌(기존 값 유지)을 구분해야 하므로 판정이 저장보다 먼저 있어야 한다(업무분담과 다른 점 표: 순서)."},"Request":{"type":"object","properties":{"kind":{"$ref":"#/$defs/RequestKind","title":"종류","description":"요청 종류.","x-why":"요청 종류마다 Plan의 응답(되풀이, 대기 안내, 미룸, 중단 확인, 안내, 직원 호출)이 다르다."},"guide_id":{"anyOf":[{"type":"string","pattern":"^[A-Za-z0-9가-힣_.\\-]{1,64}$","description":"요청하는 안내 항목의 "invalidated_questions"],"additionalProperties":false,"title":"저장 결과 요약","description":"이번 저장 결정으로 무엇이 바뀌었는지.","x-why":"Plan은 저장 결정을 해석하지 않고 결과만 보고 알릴 것을 정한다. 저장 동작이 바뀌어도 Plan은 바뀌지 않는다."},"StoreResult":{"type":"object","properties":{"store_decisions":{"type":"array","items":{"$ref":"#/$defs/StoreDecision"},"maxItems":100,"title":"저장 결정","description":"슬롯별 쓰기.","x-why":"기록 저장소가 판단 없이 반영하도록 슬롯별 할 일을 다 정해 보낸다."},"store_summary":{"$ref":"#/$defs/StoreSummary","title":"저장 결과 요약","description":"바뀐 것.","x-why":"Plan이 저장 동작을 해석하지 않고도 무엇이 바뀌었는지 알도록 결과만 요약해 넘긴다."}},"required":["store_decisions","store_summary"],"additionalProperties":false,"title":"저장 판단 출력","description":"저장 결정과 저장 결과 요약.","x-why":"저장 결정은 기록 저장소가, 요약은 Plan이 받아서 각자 필요한 것만 본다."},"SayValue":{"type":"object","properties":{"slot":{"$ref":"#/$defs/SlotRef","title":"슬롯","description":"값의 슬롯.","x-why":"같은 문항에 칸이 여럿이면 어느 칸의 값인지 있어야 LoRA-B가 맞는 이름과 함께 말한다."},"question_name":{"type":"string","minLength":1,"maxLength":2000,"title":"문항 이름","description":"문항 정의의 문항 이름.","x-why":"LoRA-B가 \"흡연량을 …\"처럼 말하려면 이름이 필요하다. LoRA-B는 문항 정의를 받지 않는다."},"value":{"$ref":"#/$defs/Value","title":"값","description":"말할 값. 역할이 이번에 말한 값이면 원문 문자열을 선택지 값 자리에 넣는다.","x-why":"LoRA-B는 값을 지어내지 않고 이 값만 말한다. 애매한 말은 사용자 원문 그대로 짚어야 하므로 원문 문자열을 넣는다."},"role":{"oneOf":[{"const":"CURRENT","title":"현재값","description":"응답 기록.현재값","x-why":"기존 답을 말해야 하는 경우: 확인 대기 확인의 기존 답, 정정 구체화에서 지금 답, 구체화 요청에서 맞지 않는 상대 슬롯의 답."},{"const":"PENDING","title":"확인 대기 값","description":"응답 기록.확인 대기 값","x-why":"확인 대기 확인에서 \"새로 말씀하신 값\"으로 말해 기존 답과 구분한다."},{"const":"JUST_SAVED","title":"방금 저장","description":"저장 결과 요약.값이 바뀐 슬롯의 새 값","x-why":"빠진 칸을 물을 때 이미 받은 값을 말해 무엇이 남았는지 알게 한다."},{"const":"SAID","title":"이번에 말한 값","description":"판정.이번에 말한 값","x-why":"구체화 요청에서 사용자가 한 말을 그대로 짚어야 무엇이 애매했는지 안다."}],"title":"역할","description":"이 값이 무엇인지.","x-why":"LoRA-B가 \"기존 답은 열 개, 이번에 스무 개\"처럼 값의 성격을 말해야 한다."}},"required":["slot","question_name","value","role"],"additionalProperties":false,"title":"말할 값" fs/SessionId","title":"세션 식별","description":"어느 세션의 값인지.","x-why":"응답 기록·진행 기록·Plan 기록·로그가 모두 이 식별로 한 세션에 묶인다. 세션 정보를 만들 때 정해져 끝까지 바뀌지 않는다(9-2절 2)."},"question_bank_version":{"type":"integer","minimum":0,"maximum":1000,"title":"문항 정의 버전","description":"세션을 만들 때의 최신 버전.","x-why":"운영 중 새 문항 정의가 등록돼도 진행 중인 세션은 처음 버전으로 끝나야 답과 문항이 어긋나지 않는다."}},"required":["session_id","question_bank_version"],"additionalProperties":false,"title":"세션 정보","description":"세션 식별과 문항 정의 버전.","x-why":"세션을 찾고(A3) 버전을 고정한다(J1)."},"ProgressRecord":{"type":"object","properties":{"last_directive":{"anyOf":[{"$ref":"#/$defs/Directive"},{"type":"null","description":"없음","x-why":"아직 아무것도 묻지 않은 세션이다(A1 시작, A2 첫 입력이 말). 9-2절 2의 초기값이 없음이라, 첫 발화를 직전 지시 없이 해석한다."}],"title":"직전 응답 지시","description":"마지막 턴의 응답 지시. 처음이면 없음.","x-why":"발화 해석과 반복 요청에만 쓴다(B5, D1)."},"open_requests":{"$ref":"#/$defs/OpenRequests","title":"열린 요청","description":"열린 요청.","x-why":"고칠 요청·중단 요청·미룸이 다른 말이 끼어도 사라지지 않게 턴 사이에 남긴다."},"skipped":{"type":"array","items":{"$ref":"#/$defs/SkipEntry"},"maxItems":200,"title":"건너뜀","description":"건너뛴 문항들.","x-why":"건너뛴 문항을 다시 묻지 않고, 결과에 받지 못한 까닭을 남긴다."},"confirm_stopped":{"type":"array","items":{"$ref":"#/$defs/SlotRef"},"maxItems":200,"title":"확인 중단","description":"확인을 그만둔 슬롯들. 확인 대기는 남는다.","x-why":"확인을 그만둔 확인 대기를 다시 묻지 않는다. 확인 대기 자체는 결과로 넘어가도록 남긴다."},"session_status":{"$ref":"#/$defs/SessionStatus","title":"세션 상태","description":"세션 상태.","x-why":"LangGraph가 처리 표로 입력을 처리할지 정하고, 결과 전달이 완료·미완료를 넘긴다."},"pause_history":{"type":"array","items":{"$ref":"#/$defs/PauseEntry"},"maxItems":100,"title":"중지 이력","description":"일시 중지·재개 기록.","x-why":"멈춘 적과 이어 간 적을 결과에 넘긴다."}},"required":["last_directive","open_requests","skipped","confirm_stopped","session_status","pause_history"],"additionalProperties":false,"title":"진행 기록","description":"Plan만 쓰는 진행 사실.","x-why":"다음에 물을 것을 매 턴 계산하는 데 쓰는 사실(열린 요청·건너뜀·확인 중단·세션 상태)을 둔다. 결정은 저장하지 않는다(원칙 7)."},"FailedStep":{"type":"object","properties":{"phase":{"oneOf":[{"const":"BEF function pathD(pts,r=9){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const l1=Math.hypot(x1-x0,y1-y0),l2=Math.hypot(x2-x1,y2-y1),rr=Math.min(r,l1/2,l2/2);
    const ax=x1-(x1-x0)/l1*rr, ay=y1-(y1-y0)/l1*rr, bx=x1+(x2-x1)/l2*rr, by=y1+(y2-y1)/l2*rr;
    d+=` L${ax},${ay} Q${x1},${y1} ${bx},${by}`;
  }
  const p=pts[pts.length-1]; return d+` L${p[0]},${p[1]}`;
}
function pointAt(pts,t){
  let tot=0; const segs=[];
  for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(l);tot+=l;}
  let want=tot*t;
  for(let i=0;i<segs.length;i++){ if(want<=segs[i]||i===segs.length-1){const k=segs[i]?want/segs[i]:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*k, pts[i][1]+(pts[i+1][1]-pts[i][1])*k];} want-=segs[i]; }
}

function viewArrowSet(v){const s=new Set();VIEW[v].steps.forEach(st=>st.arrows.forEach(a=>s.add(a)));return s;}
function firstStepIndex(v,id){return VIEW[v].steps.findIndex(st=>st.arrows.includes(id));}
function nodesUsed(v){const s=new Set();viewArrowSet(v).forEach(id=>{s.add(ARR[id].frm);s.add(ARR[id].to);});return s;}

function paint(){
  const view=VIEW[S.view], all=S.view==='all';
  const vset=all?null:viewArrowSet(S.view);
  const used=all?null:nodesUsed(S.view);
  const curStep=S.step>=0?view.steps[S.step]:null;
  document.querySelectorAll('.arrow').forEach(g=>{
    const id=g.dataset.id, a=ARR[id];
    let cls='arrow '+a.kind;
    let hidden=!S.kinds[a.kind];
    if(all && S.snap){ if(!a.feeds.some(f=>f.snapshot===S.snap)) cls+=' dim'; }
    if(!all){
      if(!vset.has(id)) hidden=true;
      else if(curStep){
        if(curStep.arrows.includes(id)) cls+=' act';
        else if(firstStepIndex(S.view,id)<S.step) cls+=' past'; else cls+=' dim';
        const st=view.steps.find(s=>s.arrows.includes(id));
        if(st&&st.optional&&st.arrows.includes(id)&&view.steps.filter(s=>s.arrows.includes(id)).every(s=>s.optional)) cls+=' opt';
      }else{
        const ss=view.steps.filter(s=>s.arrows.includes(id));
        if(ss.every(s=>s.optional)) cls+=' opt';
      }
    }
    if(hidden) cls+=' hidden';
    if(S.arrow===id) cls+=' sel';
    g.setAttribute('class',cls);
    g._badge.textContent = (all)?id:(String(firstStepIndex(S.view,id)+1)+(id.length?'·'+id:''));
    const r=g.querySelector('rect.bd'); const w=g._badge.textContent.length*6.4+12; const cx=+g._badge.getAttribute('x'); r.setAttribute('x',cx-w/2); r.setAttribute('width',w);

}

/* ---------- schema rendering ---------- */
const refName=n=>n&&n.$ref?n.$ref.split('/').pop():null;
const resolve=n=>{let g=0;while(n&&n.$ref&&g++<8)n=D.defs[refName(n)];return n||{};};
function unwrapNull(n){
  if(n&&n.anyOf&&n.anyOf.length===2){const [a,b]=n.anyOf;
    if(b&&b.type==='null')return [a,true]; if(a&&a.type==='null')return [b,true];}
  return [n,false];
}
function tshort(n){
  if(!n)return'';
  if(n.$ref)return refName(n);
  if('const' in n)return JSON.stringify(n.const);
  if(n.enum)return n.enum.map(x=>JSON.stringify(x)).join(' | ');
  for(const k of['anyOf','oneOf'])if(n[k]){
    const p=n[k].map(tshort); return p.join(' | ');
  }
  if(n.type==='array')return 'array<'+tshort(n.items||{})+'>'+(n.maxItems?` (≤${n.maxItems})`:'');
  if(n.type==='object')return'object';
  if((n.type==='integer'||n.type==='number')&&('minimum' in n||'maximum' in n))return `${n.type}(${n.minimum??''}..${n.maximum??''})`;
  if(n.type==='string'&&n.maxLength)return `string(≤${n.maxLength})`;
  return n.type||'';
}
function tyHtml(str){return H(str).replace(/[A-Z][A-Za-z0-9]+/g,m=>D.defs[m]?`<a class="tref" data-t="${m}" role="link" tabindex="0">${m}</a>`:m);}
function enumChips(n){ // n resolved; return html or ''
  const alts=n.oneOf||n.anyOf;
  if(alts&&alts.length&&alts.every(x=>'const' in x)){
    return `<div class="enum">${alts.map(x=>`<span class="ev" title="${H([x.title,x.description].filter(Boolean).join(' — '))}">${H(x.const===null?'null':x.const)}</span>`).join('')}</div>`;
  }
  if(n.enum)return `<div class="enum">${n.enum.map(x=>`<span class="ev">${H(x)}</span>`).join('')}</div>`;
  return'';
}
const MAXDEPTH=3;
function rowsFor(node,depth,seen){ // node: schema node (may be $ref); returns html rows describing its children
  const [inner]=unwrapNull(node);
  const rn=refName(inner);
  if(rn&&seen.includes(rn))return `<div class="ev">↻ ${H(rn)} (위와 같음)</div>`;
  const seen2=rn?[...seen,rn]:seen;
  const r=resolve(inner);
  let html=enumChips(r);
  if(r.type==='array'){
    const it=r.items||{};const [iin]=unwrapNull(it);const ir=resolve(iin);
    if(ir.type==='object'&&ir.properties){html+=`<div class="ex-note" style="margin:2px 0">배열 원소: <b>${tyHtml(tshort(it))}</b></div>`+rowsFor(it,depth,seen2);}
    else html+=rowsFor(it,depth,seen2);
    return html;
  }
  if(r.properties){
    const req=new Set(r.required||[]);
    html+=Object.entries(r.properties).map(([k,v])=>fieldRow(k,v,req.has(k),depth,seen2)).join('');
  }
  const alts=(r.oneOf||r.anyOf)||[];
  if(alts.length&&!alts.every(x=>'const' in x)&&!(r.anyOf&&unwrapNull(r)[1])){
    html+=alts.map(b=>{
      const br=resolve(b);
      const title=b.title||br.title||refName(b)||'';
      const inside=(br.properties&&depth<MAXDEPTH+2)?rowsFor(b,depth+1,seen2):'';
      return `<details ${depth<=1?'open':''}><summary><b>${H(title||tshort(b))}</b> <span style="color:var(--mute)">${H(b.description||br.description||'')}</span></summary><div class="kids">${inside||`<span class="ev">${H(tshort(b))}</span>`}</div></details>`;
    }).join('');
  }
  return html;
}
function fieldRow(name,node,req,depth,seen){
  const [inner,nullable]=unwrapNull(node);
  const r=resolve(inner);
  const title=node.title||r.title||'';
  const desc=node.description||(r.description&&!node.title?r.description:'')||'';
  const why=node['x-why']||'';
  const expandable=(r.properties||(r.type==='array'&&(resolve(unwrapNull(r.items||{})[0]).properties||(resolve(unwrapNull(r.items||{})[0]).oneOf)))||(r.oneOf&&!r.oneOf.every(x=>'const' in x))||enumChips(r));
  let kids='';
  if(expandable&&depth<=MAXDEPTH){
    const inner2=rowsFor(inner,depth+1,seen);
    if(inner2)kids=`<details ${depth<=0?'open':''} style="grid-column:1/-1"><summary>${r.properties||r.type==='array'?'세부 필드':'값 목록'}</summary><div class="kids">${inner2}</div></details>`;
  }
  return `<div class="fr"><div class="nm">${H(name)}${req?'<span class="rq" title="필수">*</span>':''}</div><div class="ty">${tyHtml(tshort(node))}${nullable&&!/null/.test(tshort(node))?' | null':''}</div>${(title||desc)?`<div class="tt">${title?`<b>${H(title)}</b> `:''}<span class="de">${H(desc)}</span></div>`:''}${why?`<div class="tt why">왜: ${H(why)}</div>`:''}${kids}</div>`;
}
function findProp(r,seg,depth=0){
  if(r.properties&&seg in r.properties)return r.properties[seg];
  if(depth>2)return null;
  for(const b of (r.oneOf||r.anyOf||[])){const rb=resolve(unwrapNull(b)[0]);const f=findProp(rb,seg,depth+1);if(f)return f;}
  return null;
}
function navNode(contract,path){
  let n=D.defs[contract]; if(!n)return null;
  if(!path)return n;
  for(const seg of path.split('.')){
    let [x]=unwrapNull(n);let r=resolve(x);
    if(r.type==='array'){r=resolve(unwrapNull(r.items||{})[0]);}
    const f=findProp(r,seg); if(!f)return null;
    n=f;
  }
  return n;
}
function schemaBlock(contract,path,showWhole){
  const n=navNode(contract,path);
  if(!n)return`<div class="desc">스키마를 찾지 못했습니다: ${H(contract)}.${H(path)}</div>`;
  const [inner,nullable]=unwrapNull(n);const r=resolve(inner);
  const head=`<div class="desc"><b style="color:var(--ink)">${H(n.title||r.title||'')}</b><span class="de"> ${H(n.description||r.description||'')}</span>${(n['x-why']||r['x-why'])?`<span class="why"><br>왜: ${H(n['x-why']||r['x-why'])}</span>`:''}</div>
   <div class="fr" style="border-top:0"><div class="nm">${H(path||contract)}</div><div class="ty">${tyHtml(tshort(n))}${nullable&&!/null/.test(tshort(n))?' | null':''}</div></div>`;
  const body=rowsFor(inner,0,[]);
  return head+`<div class="tree">${body}</div>`;
}
function jsonBlock(v,missing){
  if(missing)return`<p class="ex-note">이 예시 턴에는 이 값이 없습니다.</p>`;
  const s=JSON.stringify(v,null,2);
  return`<pre class="json">${H(s===undefined?'(없음)':s)}</pre>`;
}
function pillFor(id){const n=NODE[id];return`<span class="pill ${n.kind}">${H(n.label)}</span>`;}

  <ul><li><b>화살표</b>를 누르면 그 화살표로 오가는 값의 <b>보내는 쪽 출력 스키마</b>와 <b>받는 쪽 입력 스키마</b>, 실제 예시 값이 한 화면에 나옵니다.</li>
  <li><b>컴포넌트</b>를 누르면 들어오는·나가는 화살표와 입출력 계약이 나옵니다.</li>
  <li>위 탭에서 <b>시점</b>(대화 시작·발화·직원 재개·직원 종료·이탈 종료·처리 안 함·턴 실패)을 고르면 그때 쓰이는 컴포넌트와 화살표만 남고, 처리 순서가 번호로 표시됩니다.</li>
  <li>“전체 구조”에서는 <b>읽는 시점</b>(턴 맨 앞·턴 시작·저장 결정 반영 뒤·턴 쓰기 반영 뒤)별로 어떤 화살표가 어느 스냅샷을 읽는지 볼 수 있습니다.</li></ul>
  <div class="legend"><span><span class="sw data"></span> 데이터 전달</span><span><span class="sw read"></span> 읽기</span><span><span class="sw write"></span> 쓰기</span><span><span class="sw control"></span> 흐름 신호</span></div>
  <p style="margin-top:14px;font-size:12.5px">예시 값은 스키마 프로젝트의 정적 예시를 가져온 <b>기준 트레이스</b>이며, 실제 실행 결과가 아닙니다.</p></div>`;
}
function selectArrow(id,fromStep){
  S.arrow=id;S.node=null;paint();STACK=[];LAST=()=>selectArrow(id,true);
  const a=ARR[id];
  const stepsHere=S.view==='all'?[]:VIEW[S.view].steps.map((s,i)=>s.arrows.includes(id)?i+1:0).filter(Boolean);
  const inViews=D.views.filter(v=>v.id!=='all'&&viewArrowSet(v.id).has(id));
  side.innerHTML=`<div class="hd"><h2><span class="id ${a.kind}" style="font-size:14px">${a.id}</span> ${H(a.label)} <span class="kindb ${a.kind}">${KINDLABEL[a.kind]}</span> <button class="btn" id="cmp" style="float:right"></button></h2>
    <div class="route">${pillFor(a.frm)} <span>→</span> ${pillFor(a.to)}</div>
    <div class="ex-note" style="margin:6px 0 0">쓰이는 시점: ${inViews.map(v=>`<button class="chip" data-v="${v.id}">${H(v.label)}</button>`).join(' ')||'—'}</div></div>
    <div class="sec"><h3>보내는 쪽 · ${H(NODE[a.frm].label)}의 출력 <span class="bar"></span></h3></div>
    <div class="pair">${a.carries.map(c=>`<div class="box"><div class="bh"><b>${H(c.contract)}</b>${c.path?`<span class="mono">.${H(c.path)}</span>`:'<span class="mono">(전체)</span>'}</div><div class="bd">${schemaBlock(c.contract,c.path)}</div></div>`).join('')}</div>
    <div class="sec"><h3>받는 쪽 · ${H(NODE[a.to].label)}의 입력 <span class="bar"></span></h3></div>
    <div class="pair">${a.feeds.length?a.feeds.map(f=>`<div class="box"><div class="bh"><b>${H(f.contract)}</b><span class="mono">.${H(f.field)}</span><span class="snap" title="이 값을 읽는 시점">${H(f.snapshot_label)}</span></div><div class="bd">${schemaBlock(f.contract,f.field)}</div></div>`).join(''):`<div class="note" style="margin:0">받는 쪽이 입력 계약의 필드가 아니라 <b>호출·분기 신호</b>입니다. (${a.id==='P16'?'dispatch_called가 true일 때 Result Dispatcher를 부릅니다.':'flow가 END이면 LangGraph가 결과 전달 단계로 갑니다.'})</div>`}</div>
    <div class="sec"><h3>예시 값 <span class="bar"></span></h3><p class="ex-note">${H(a.scenario)} · ${a.turn}번째 턴 · ${H(typeof a.situation==='object'?Object.entries(a.situation).map(([k,v])=>k+' '+v).join(' / '):(a.situation||''))}${a.utterance?` · 발화: “${H(a.utterance)}”`:''}<br>기준 트레이스의 값이며 실제 실행 결과가 아닙니다.</p></div>
    <div class="pair">${a.carries.map(c=>`<div><div class="ex-note"><b>보낸 값</b> — ${H(c.contract)}${c.path?'.'+H(c.path):''}</div>${jsonBlock(c.value,c.missing)}${a.id==='P14'||a.id==='P15'?'<p class="ex-note">정상 턴이라 turn_failure_signal은 null입니다. 실패 시에는 어느 단계에서 실패했는지가 들어갑니다.</p>':''}</div>`).join('')}
    ${a.feeds.map(f=>{const same=a.carries.length===1&&!f.missing&&JSON.stringify(f.value)===JSON.stringify(a.carries[0].value);
      return `<div><div class="ex-note"><b>받은 값</b> — ${H(f.contract)}.${H(f.field)} <span class="ev">${H(f.snapshot_label)}</span></div>${same?'<p class="ex-note">보낸 값과 같다.</p>':jsonBlock(f.value,f.missing)}</div>`;}).join('')}</div>
    ${stepsHere.length?`<div class="note">이 시점(${H(VIEW[S.view].label)})의 처리 순서 ${stepsHere.join(', ')}번에 쓰입니다.</div>`:''}`;
  side.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{setView(b.dataset.v,true);selectArrow(id);});
  bindCmp();
  if(!fromStep)side.scrollTop=0;
}
function selectNode(id){
  S.node=id;S.arrow=null;paint();STACK=[];LAST=()=>selectNode(id);
  const n=NODE[id], c=D.comps[id];
  const ins=D.arrows.filter(a=>a.to===id), outs=D.arrows.filter(a=>a.frm===id);
  const views=D.views.filter(v=>v.id!=='all'&&nodesUsed(v.id).has(id));
  const al=list=>`<div class="arrowlist">${list.map(a=>`<span class="id ${a.kind}" data-a="${a.id}" title="${H(a.label)}">${a.id} ${H(a.label)} ${list===ins?'← '+H(NODE[a.frm].label):'→ '+H(NODE[a.to].label)}</span>`).join('')||'<span class="ex-note">없음</span>'}</div>`;
  const cs=c?Object.entries(c.contracts):[];
  side.innerHTML=`<div class="hd"><h2>${H(n.label)} <span class="pill ${n.kind}">${NODEKIND[n.kind]}</span> <button class="btn" id="cmp" style="float:right"></button></h2><div class="ex-note" style="margin:0">${H(n.sub)}</div></div>
   ${c?`<div class="sec"><h3>역할 <span class="bar"></span></h3><p style="margin:0 0 4px">${H(c.resp)}</p><p class="ex-note" style="margin:0">왜: ${H(c.why)}</p></div>`:''}
   <div class="sec"><h3>쓰이는 시점 <span class="bar"></span></h3><div class="arrowlist">${views.map(v=>`<button class="chip" data-v="${v.id}">${H(v.label)}</button>`).join('')||'<span class="ex-note">—</span>'}</div>
   ${D.views.filter(v=>v.id!=='all'&&!nodesUsed(v.id).has(id)).length?`<p class="ex-note" style="margin:0">쓰이지 않는 시점: ${D.views.filter(v=>v.id!=='all'&&!nodesUsed(v.id).has(id)).map(v=>H(v.label)).join(', ')}</p>`:''}</div>
   <div class="sec"><h3>들어오는 화살표 <span class="bar"></span></h3>${al(ins)}</div>
   <div class="sec"><h3>나가는 화살표 <span class="bar"></span></h3>${al(outs)}</div>
   ${cs.map(([k,name])=>`<div class="sec"><h3>${k==='input'?'입력 계약':'출력 계약'} · <span class="mono">${H(name)}</span> <span class="bar"></span></h3></div><div class="pair"><div class="box"><div class="bd">${schemaBlock(name,'')}</div></div></div>`).join('')}`;
  side.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>selectArrow(b.dataset.a));
  side.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{setView(b.dataset.v,true);selectNode(id);});
  bindCmp();
  side.scrollTop=0;
}

let LAST=null, STACK=[];
function selectType(name,push=true){
  if(push&&LAST)STACK.push(LAST);
  const d=D.defs[name]; if(!d)return;
  const users=Object.keys(D.defs).filter(k=>k!==name&&JSON.stringify(D.defs[k]).includes('"#/$defs/'+name+'"'));
  side.innerHTML=`<div class="hd"><h2>${H(name)} <span class="pill ext">공통 타입</span> <button class="btn" id="cmp" style="float:right"></button></h2>
   <div class="ex-note" style="margin:0">${H(d.title||'')} · 파일: <span class="mono">schemas/types/${H(name)}.json</span></div>
   <div style="margin-top:6px">${STACK.length?'<button class="btn" id="back">← 돌아가기</button>':''}</div></div>
   <div class="pair"><div class="box"><div class="bd">${schemaBlock(name,'')}</div></div>
   <div><div class="ex-note"><b>이 타입을 참조하는 타입</b></div><div class="arrowlist">${users.map(u=>`<a class="tref" data-t="${u}" tabindex="0">${u}</a>`).join(' · ')||'—'}</div></div></div>`;
  LAST=()=>selectType(name,false);
  const b=side.querySelector('#back'); if(b)b.onclick=()=>{const f=STACK.pop();f&&f();};
  bindCmp(); side.scrollTop=0;
}
side.addEventListener('click',e=>{const t=e.target.closest('.tref');if(t){e.preventDefault();selectType(t.dataset.t);}});
side.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('tref'))selectType(e.target.dataset.t);});
/* ---------- misc ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(e.key==='Escape'){S.arrow=null;S.node=null;S.step=-1;renderSteps();paint();renderHint();return;}
  if(/^[1-9]$/.test(e.key)&&D.views[+e.key-1]){setView(D.views[+e.key-1].id);return;}
  if(S.view!=='all'){
    const n=VIEW[S.view].steps.length;
    if(e.key==='ArrowRight'){e.preventDefault();gotoStep(Math.min(n-1,S.step+1));}
    if(e.key==='ArrowLeft'){e.preventDefault();gotoStep(Math.max(0,S.step-1));}
  }
});
document.getElementById('theme').onclick=()=>{
  const r=document.documentElement; const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  r.dataset.theme=cur==='dark'?'light':'dark';
};
setView('all');
// deep link: #P4, #view=UTTERANCE
(function(){const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('view=')&&VIEW[h.slice(5)])setView(h.slice(5));
  else if(ARR[h])selectArrow(h);})();
</script>
</body>
